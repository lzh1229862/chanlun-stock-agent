# 缠论股票分析 Agent 配置（见 docs/PRD.md 第 7 节）

# 自选股（股票池）。报告对池内每只股票出一行：无信号的只进表格、不调 LLM。
# 上限 10 只（watchlist_store.MAX_STOCKS；Web UI 保存时同样校验）。
# 下面 10 只为技术验证用的分散样本：沪深主板 / 创业板 / 科创板四个板块都覆盖到，
# 且行业互不重复，非投资建议。
# 想换成自己的股票：双击 run_ui.bat -> 侧边栏「自选股与日报」-> 编辑 -> 替换股票池。
pool_name: "技术样本池"   # 股票池显示名（UI 里可改；改后写到 config/watchlist.local.yaml）
watchlist:
  - "600519"   # 贵州茅台  沪市主板 消费
  - "601318"   # 中国平安  沪市主板 保险
  - "600036"   # 招商银行  沪市主板 银行
  - "600030"   # 中信证券  沪市主板 券商
  - "000858"   # 五粮液    深市主板 白酒
  - "000333"   # 美的集团  深市主板 家电
  - "002594"   # 比亚迪    深市主板 汽车
  - "300750"   # 宁德时代  创业板   电池
  - "688981"   # 中芯国际  科创板   半导体
  - "688111"   # 金山办公  科创板   软件
# 为压到 10 只上限而移除的两只（行业与池内其他股票重复；想加回来就把上面某只换掉）：
#   - "000001"   # 平安银行  深市主板 银行   （银行已有 600036 招商银行）
#   - "300059"   # 东方财富  创业板   券商   （券商已有 600030 中信证券）

# 报告输出
report:
  output_dir: "reports"

# 信号过滤（PRD F3）
filter:
  # F3.4 量能过滤（P2，可选）。enable=false 时以下三条全部不生效。
  # 「成交量异常」有三种读法，各自独立可关：
  #   停牌      成交量为 0，根本没法成交
  #   流动性低  成交额低于下限，量太小、滑点大
  #   放量异常  成交量远高于近期均量，常见于异动或停牌复牌
  volume:
    enable: false            # 总开关，默认关（P2 可选项）
    exclude_suspended: true  # 信号日成交量为 0 -> 不可交易
    min_amount: 10000000     # 信号日成交额下限（元）= 1000 万，低于视为流动性不足
    max_volume_ratio: 10.0   # 信号日成交量 / 前 20 日均量 的上限，超过视为放量异常
