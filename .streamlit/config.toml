# 缠论分析 Agent - UI theme
# **默认白天**：CSS 变量层（skin.py 的 LIGHT）负责页面主体，这里负责原生控件
# （下拉弹层 / 日历 / dataframe 画布），两边必须同一套色，否则会一半白一半黑。
# 夜晚 UI 由侧边栏左下角开关切换（纯 CSS 覆盖，不依赖这里的 base）。
[theme]
base = "light"
primaryColor = "#0E7490"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#EEF3FA"
textColor = "#16233D"
font = "sans-serif"

[client]
# minimal: 顶部菜单只留最少项；皮肤切换由侧边栏左下角开关负责
toolbarMode = "minimal"

[server]
# 关键：false 才会在启动后自动打开浏览器（run_ui.bat 依赖这条）
headless = false

[browser]
gatherUsageStats = false
